<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes de frais</title>
  <meta name="description" content="Photographiez vos tickets, laissez l'IA les lire et envoyez vos notes de frais au bon format, à la bonne personne.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Frais">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
  </div>

  <input type="file" id="capture-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-input" accept="image/*,application/pdf,.heic,.heif" multiple hidden>

  <div id="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="drop-overlay" class="drop-overlay">
    <div>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      Déposez vos tickets et factures
    </div>
  </div>

  <noscript>Cette application a besoin de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
